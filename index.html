<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G6 Austral | Noticias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
        }

        header {
            background: #111111;
            border-bottom: 2px solid #d71920;
            padding: 25px 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 5px;
            color: #aaa;
            font-size: 14px;
            letter-spacing: 1px;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            border-left: 5px solid #d71920;
            padding-left: 12px;
            margin-bottom: 25px;
            font-size: 24px;
        }

        #news {
            display: grid;
            gap: 18px;
        }

        .news-card {
            background: #151515;
            border: 1px solid #292929;
            padding: 20px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .news-card:hover {
            border-color: #d71920;
            transform: translateY(-2px);
        }

        .source {
            color: #d71920;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .news-card h2 {
            margin: 0 0 10px;
            font-size: 20px;
            line-height: 1.3;
        }

        .news-card p {
            color: #bbb;
            line-height: 1.5;
        }

        .news-card a {
            display: inline-block;
            margin-top: 10px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        .news-card a:hover {
            color: #d71920;
        }

        .loading {
            color: #aaa;
            padding: 30px 0;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #777;
            border-top: 1px solid #222;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">G6 AUSTRAL</div>
        <div class="subtitle">
            INFORMACIÓN · DEFENSA · SEGURIDAD · INTERNACIONAL
        </div>
    </div>
</header>

<main>

    <h1 class="section-title">Últimas Noticias</h1>

    <div id="news">
        <div class="loading">
            Cargando noticias...
        </div>
    </div>

</main>

<footer>
    G6 Austral · Noticias y actualidad
</footer>

<script>

const RSS_URL = "feed.xml";

async function cargarNoticias() {

    try {

        const respuesta = await fetch(RSS_URL);

        if (!respuesta.ok) {
            throw new Error("No se pudo cargar el RSS");
        }

        const texto = await respuesta.text();

        const parser = new DOMParser();

        const xml = parser.parseFromString(
            texto,
            "application/xml"
        );

        const items = xml.querySelectorAll("item");

        const contenedor = document.getElementById("news");

        contenedor.innerHTML = "";

        items.forEach(item => {

            const titulo =
                item.querySelector("title")?.textContent || "";

            const enlace =
                item.querySelector("link")?.textContent || "#";

            const descripcion =
                item.querySelector("description")?.textContent || "";

            const fuente =
                item.querySelector("source")?.textContent || "G6 Austral";

            const tarjeta =
                document.createElement("article");

            tarjeta.className = "news-card";

            tarjeta.innerHTML = `
                <div class="source">
                    ${fuente}
                </div>

                <h2>
                    ${titulo}
                </h2>

                <p>
                    ${descripcion}
                </p>

                <a href="${enlace}" target="_blank" rel="noopener noreferrer">
                    Leer noticia →
                </a>
            `;

            contenedor.appendChild(tarjeta);

        });

    } catch (error) {

        document.getElementById("news").innerHTML = `
            <div class="loading">
                No fue posible cargar las noticias.
            </div>
        `;

        console.error(error);
    }
}

cargarNoticias();

</script>

</body>
</html>
