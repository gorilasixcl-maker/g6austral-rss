<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Informados No Manipulados — Noticias</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 360px;

      background:
        linear-gradient(
          rgba(0,0,0,.45),
          rgba(0,0,0,.78)
        ),
        url("banner-g6austral.png")
        center/cover no-repeat;

      display: flex;
      align-items: flex-end;

      padding: 50px 6%;
    }


    .hero-content {
      max-width: 900px;
    }


    .hero h1 {
      margin: 0;

      font-size:
        clamp(42px, 7vw, 82px);

      font-weight: 900;

      letter-spacing: -3px;
    }


    .hero p {
      margin: 10px 0 0;

      font-size:
        clamp(16px, 2vw, 24px);

      color: #ddd;
    }


    /* =========================
       NAV
    ========================= */

    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      gap: 8px;

      padding: 12px 5%;

      background:
        rgba(10,10,10,.96);

      border-bottom:
        1px solid #292929;

      overflow-x: auto;
    }


    .nav button {
      flex-shrink: 0;

      border:
        1px solid #444;

      background: #151515;

      color: #ddd;

      padding:
        9px 15px;

      border-radius:
        20px;

      cursor: pointer;

      font-weight: bold;
    }


    .nav button:hover,
    .nav button.active {

      background: #ffffff;
      color: #000;
    }


    /* =========================
       CONTENEDOR
    ========================= */

    .container {

      width: 90%;
      max-width: 1400px;

      margin:
        30px auto 70px;
    }


    /* =========================
       BUSCADOR
    ========================= */

    .search-container {

      margin-bottom: 30px;

      display: flex;

      justify-content:
        center;
    }


    .search-box {

      width: 100%;

      max-width: 800px;

      position: relative;
    }


    .search-icon {

      position: absolute;

      left: 18px;

      top: 50%;

      transform:
        translateY(-50%);

      font-size: 20px;

      color: #777;

      pointer-events: none;
    }


    #searchInput {

      width: 100%;

      padding:
        16px 50px 16px 50px;

      border:
        1px solid #383838;

      border-radius:
        30px;

      background:
        #151515;

      color: #ffffff;

      font-size: 17px;

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }


    #searchInput:focus {

      border-color:
        #777;

      box-shadow:
        0 0 0 3px
        rgba(255,255,255,.06);
    }


    #searchInput::placeholder {
      color: #777;
    }


    .clear-search {

      position: absolute;

      right: 15px;

      top: 50%;

      transform:
        translateY(-50%);

      width: 32px;
      height: 32px;

      border: none;

      border-radius: 50%;

      background: #292929;

      color: #aaa;

      cursor: pointer;

      display: none;

      font-size: 18px;
    }


    .clear-search:hover {

      background: #444;

      color: #fff;
    }


    .search-info {

      text-align: center;

      color: #777;

      font-size: 13px;

      margin-top: 10px;

      min-height: 18px;
    }


    /* =========================
       DESTACADA
    ========================= */

    .featured {
      margin-bottom: 35px;
    }


    .featured-card {

      display: grid;

      grid-template-columns:
        1.35fr 1fr;

      background:
        #151515;

      border:
        1px solid #292929;

      border-radius:
        14px;

      overflow: hidden;

      transition:
        transform .2s ease;
    }


    .featured-card:hover {
      transform:
        translateY(-3px);
    }


    .featured-image {

      width: 100%;

      height: 100%;

      min-height: 390px;

      object-fit: cover;

      display: block;

      background:
        #202020;
    }


    .featured-content {

      padding: 35px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    .featured-source {

      color: #aaa;

      font-size: 13px;

      font-weight: bold;

      text-transform:
        uppercase;

      margin-bottom: 12px;
    }


    .featured-title {

      font-size:
        clamp(28px, 4vw, 48px);

      line-height: 1.08;

      margin:
        0 0 18px;

      font-weight: 900;
    }


    .featured-description {

      color: #bbb;

      line-height: 1.6;

      font-size: 16px;
    }


    .featured-date {

      color: #777;

      margin-top: 20px;

      font-size: 13px;
    }


    /* =========================
       GRID
    ========================= */

    .section-title {

      font-size: 26px;

      margin:
        0 0 20px;

      font-weight: 900;
    }


    .news-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;
    }


    .news-card {

      background:
        #151515;

      border:
        1px solid #292929;

      border-radius:
        12px;

      overflow: hidden;

      transition:
        transform .2s ease,
        border-color .2s ease;
    }


    .news-card:hover {

      transform:
        translateY(-4px);

      border-color:
        #555;
    }


    .news-image {

      width: 100%;

      aspect-ratio:
        16 / 9;

      object-fit: cover;

      display: block;

      background:
        #202020;
    }


    .news-content {

      padding: 20px;
    }


    .news-source {

      color: #999;

      font-size: 12px;

      font-weight: bold;

      text-transform:
        uppercase;

      margin-bottom: 8px;
    }


    .news-title {

      font-size: 20px;

      line-height: 1.25;

      margin:
        0 0 12px;

      font-weight: 800;
    }


    .news-description {

      color: #aaa;

      font-size: 14px;

      line-height: 1.5;
    }


    .news-date {

      margin-top: 15px;

      color: #666;

      font-size: 12px;
    }


    /* =========================
       SIN RESULTADOS
    ========================= */

    .empty {

      grid-column:
        1 / -1;

      text-align: center;

      padding:
        60px 20px;

      color: #777;

      font-size: 16px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      border-top:
        1px solid #222;

      padding:
        30px 5%;

      text-align: center;

      color: #666;

      font-size: 13px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

      .news-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }


      .featured-card {

        grid-template-columns:
          1fr;
      }


      .featured-image {

        min-height:
          280px;
      }
    }


    @media (max-width: 650px) {

      .hero {

        min-height:
          300px;

        padding:
          35px 6%;
      }


      .container {

        width:
          94%;
      }


      .news-grid {

        grid-template-columns:
          1fr;
      }


      .featured-content {

        padding:
          25px;
      }


      .featured-title {

        font-size:
          30px;
      }


      #searchInput {

        font-size:
          16px;
      }
    }

  </style>

</head>


<body>


  <!-- =================================================
       HERO
  ================================================== -->

  <header class="hero">

    <div class="hero-content">

      <h1>
        Informados No Manipulados
      </h1>

      <p>
        Noticias, actualidad, defensa,
        seguridad e internacional.
      </p>

    </div>

  </header>


  <!-- =================================================
       NAVEGACIÓN
  ================================================== -->

  <nav class="nav">

    <button
      class="active"
      data-category="TODAS">

      ÚLTIMAS

    </button>


    <button
      data-category="CHILE">

      CHILE

    </button>


    <button
      data-category="POLÍTICA">

      POLÍTICA

    </button>


    <button
      data-category="DEFENSA">

      DEFENSA

    </button>


    <button
      data-category="SEGURIDAD">

      SEGURIDAD

    </button>


    <button
      data-category="INTERNACIONAL">

      INTERNACIONAL

    </button>


    <button
      data-category="ECONOMÍA">

      ECONOMÍA

    </button>

  </nav>


  <!-- =================================================
       CONTENIDO
  ================================================== -->

  <main class="container">


    <!-- BUSCADOR -->

    <div class="search-container">

      <div class="search-box">

        <span class="search-icon">
          🔎
        </span>


        <input
          type="search"
          id="searchInput"
          placeholder="Buscar noticias..."
          autocomplete="off"
        >


        <button
          class="clear-search"
          id="clearSearch"
          aria-label="Limpiar búsqueda">

          ×

        </button>

      </div>

    </div>


    <div
      class="search-info"
      id="searchInfo">
    </div>


    <!-- DESTACADA -->

    <section
      class="featured"
      id="featured">
    </section>


    <h2
      class="section-title"
      id="sectionTitle">

      Últimas noticias

    </h2>


    <!-- NOTICIAS -->

    <section
      class="news-grid"
      id="news">
    </section>


  </main>


  <footer>

    Informados No Manipulados · Noticias y Actualidad

  </footer>


  <script>


    /* =================================================
       CONFIGURACIÓN
    ================================================== */

    const RSS_URL =
      "feed.xml";


    const MEDIA_NAMESPACE =
      "http://search.yahoo.com/mrss/";


    let allNews = [];

    let currentCategory =
      "TODAS";

    let currentSearch =
      "";


    /* =================================================
       LIMPIAR TEXTO
    ================================================== */

    function cleanText(text) {

      if (!text)
        return "";

      const div =
        document.createElement(
          "div"
        );

      div.innerHTML =
        text;

      return div.textContent
        .replace(/\s+/g, " ")
        .trim();
    }


    /* =================================================
       CATEGORÍAS
    ================================================== */

    function categorize(
      title,
      description
    ) {

      const text =
        (
          title +
          " " +
          description
        ).toLowerCase();


      if (
        /ejército|militar|militares|ffaa|fuerzas armadas|defensa|armada|fuerza aérea|carabineros de chile|infantería|otan|misil|misiles|tanque|tanques|guerra|conflicto armado/
        .test(text)
      ) {

        return "DEFENSA";

      }


      if (
        /delito|crimen|criminal|asesinato|homicidio|robo|narcotráfico|narco|droga|carabinero|policía|seguridad|violencia|banda criminal|terrorismo/
        .test(text)
      ) {

        return "SEGURIDAD";

      }


      if (
        /presidente|gobierno|congreso|diputado|diputada|senado|senador|senadora|elección|elecciones|política|ministro|ministra|partido político|kast|boric|jadue/
        .test(text)
      ) {

        return "POLÍTICA";

      }


      if (
        /economía|economia|mercado|bolsa|dólar|dolar|inflación|inflacion|banco central|empresas|empleo|desempleo|finanzas|petróleo/
        .test(text)
      ) {

        return "ECONOMÍA";

      }


      if (
        /eeuu|estados unidos|china|rusia|ucrania|israel|palestina|irán|iran|europa|argentina|perú|peru|bolivia|venezuela|méxico|mexico|mundo|internacional|geopolítica|geopolitica/
        .test(text)
      ) {

        return "INTERNACIONAL";

      }


      return "CHILE";

    }


    /* =================================================
       OBTENER IMAGEN
    ================================================== */

    function getImage(item) {


      /* media:content */

      const mediaContent =
        item.getElementsByTagNameNS(
          MEDIA_NAMESPACE,
          "content"
        )[0];


      if (mediaContent) {

        const url =
          mediaContent.getAttribute(
            "url"
          );

        if (url)
          return url;

      }


      /* media:thumbnail */

      const thumbnail =
        item.getElementsByTagNameNS(
          MEDIA_NAMESPACE,
          "thumbnail"
        )[0];


      if (thumbnail) {

        const url =
          thumbnail.getAttribute(
            "url"
          );

        if (url)
          return url;

      }


      /* enclosure */

      const enclosure =
        item.querySelector(
          "enclosure"
        );


      if (enclosure) {

        const url =
          enclosure.getAttribute(
            "url"
          );

        const type =
          enclosure.getAttribute(
            "type"
          ) || "";


        if (
          url &&
          (
            type.startsWith(
              "image/"
            )
            ||
            /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i
              .test(url)
          )
        ) {

          return url;

        }

      }


      /* imagen dentro de description */

      const description =
        item.querySelector(
          "description"
        )?.textContent || "";


      const match =
        description.match(
          /<img[^>]+(?:src|data-src|data-lazy-src)=["']([^"']+)["']/i
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      return "";

    }


    /* =================================================
       CARGAR RSS
    ================================================== */

    async function loadRSS() {

      try {

        const response =
          await fetch(
            RSS_URL +
            "?t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "No se pudo cargar el RSS"
          );

        }


        const text =
          await response.text();


        const parser =
          new DOMParser();


        const xml =
          parser.parseFromString(
            text,
            "application/xml"
          );


        const items =
          Array.from(
            xml.querySelectorAll(
              "item"
            )
          );


        allNews =
          items.map(
            item => {


              const title =
                cleanText(
                  item.querySelector(
                    "title"
                  )?.textContent
                );


              const link =
                item.querySelector(
                  "link"
                )?.textContent?.trim()
                || "#";


              const description =
                cleanText(
                  item.querySelector(
                    "description"
                  )?.textContent
                );


              const source =
                cleanText(
                  item.querySelector(
                    "source"
                  )?.textContent
                );


              const pubDate =
                item.querySelector(
                  "pubDate"
                )?.textContent
                || "";


              const image =
                getImage(
                  item
                );


              return {

                title,
                link,
                description,
                source,
                pubDate,
                image,

                category:
                  categorize(
                    title,
                    description
                  )

              };

            }
          );


        renderNews();

      }


      catch (error) {

        console.error(
          "Error cargando RSS:",
          error
        );


        document.getElementById(
          "news"
        ).innerHTML = `

          <div class="empty">

            No se pudieron cargar
            las noticias.

          </div>

        `;

      }

    }


    /* =================================================
       FECHA
    ================================================== */

    function formatDate(
      date
    ) {

      if (!date)
        return "";


      const d =
        new Date(date);


      if (
        isNaN(d)
      )
        return "";


      return d.toLocaleString(
        "es-CL",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =================================================
       BUSCAR
    ================================================== */

    function searchNews(
      news
    ) {

      if (
        !currentSearch
      ) {

        return true;

      }


      const search =
        currentSearch
          .toLowerCase()
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          );


      const text =
        (
          news.title +
          " " +
          news.source +
          " " +
          news.description
        )
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );


      return text.includes(
        search
      );

    }


    /* =================================================
       ESCAPAR HTML
    ================================================== */

    function escapeHTML(
      text
    ) {

      if (!text)
        return "";


      return text
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(
      text
    ) {

      return escapeHTML(
        text || "#"
      );

    }


    /* =================================================
       RENDER
    ================================================== */

    function renderNews() {


      /* FILTRAR POR CATEGORÍA */

      let filtered =
        allNews.filter(
          news => {

            if (
              currentCategory !==
              "TODAS"
            ) {

              if (
                news.category !==
                currentCategory
              ) {

                return false;

              }

            }


            return searchNews(
              news
            );

          }
        );


      /* INFORMACIÓN DEL BUSCADOR */

      const searchInfo =
        document.getElementById(
          "searchInfo"
        );


      if (
        currentSearch
      ) {

        searchInfo.textContent =
          `${filtered.length} resultado${
            filtered.length === 1
              ? ""
              : "s"
          } para "${currentSearch}"`;

      }

      else {

        searchInfo.textContent =
          "";

      }


      /* TÍTULO */

      const sectionTitle =
        document.getElementById(
          "sectionTitle"
        );


      if (
        currentSearch
      ) {

        sectionTitle.textContent =
          "Resultados de búsqueda";

      }

      else if (
        currentCategory !==
        "TODAS"
      ) {

        sectionTitle.textContent =
          currentCategory;

      }

      else {

        sectionTitle.textContent =
          "Últimas noticias";

      }


      /* SIN RESULTADOS */

      if (
        !filtered.length
      ) {

        document.getElementById(
          "featured"
        ).innerHTML =
          "";


        document.getElementById(
          "news"
        ).innerHTML = `

          <div class="empty">

            🔎

            <br><br>

            No encontramos noticias
            que coincidan con tu búsqueda.

          </div>

        `;

        return;

      }


      /* DESTACADA */

      const featured =
        filtered[0];


      const remaining =
        filtered.slice(
          1,
          19
        );


      const featuredContainer =
        document.getElementById(
          "featured"
        );


      const featuredImage =
        featured.image
          ? `

            <img
              class="featured-image"
              src="${escapeAttribute(
                featured.image
              )}"
              alt=""
              loading="eager"
            >

          `
          : "";


      featuredContainer.innerHTML = `

        <a
          href="${escapeAttribute(
            featured.link
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <article
            class="featured-card"
          >

            ${featuredImage}


            <div
              class="featured-content"
            >

              <div
                class="featured-source"
              >

                ${escapeHTML(
                  featured.source
                )}

              </div>


              <h2
                class="featured-title"
              >

                ${escapeHTML(
                  featured.title
                )}

              </h2>


              <div
                class="featured-description"
              >

                ${escapeHTML(
                  featured.description
                    .substring(
                      0,
                      350
                    )
                )}

              </div>


              <div
                class="featured-date"
              >

                ${formatDate(
                  featured.pubDate
                )}

              </div>

            </div>

          </article>

        </a>

      `;


      /* NOTICIAS */

      const newsContainer =
        document.getElementById(
          "news"
        );


      if (
        !remaining.length
      ) {

        newsContainer.innerHTML =
          "";

        return;

      }


      newsContainer.innerHTML =
        remaining
          .map(
            news => {


              const imageHTML =
                news.image
                  ? `

                    <img
                      class="news-image"
                      src="${escapeAttribute(
                        news.image
                      )}"
                      alt=""
                      loading="lazy"
                    >

                  `
                  : "";


              return `

                <a
                  href="${escapeAttribute(
                    news.link
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >

                  <article
                    class="news-card"
                  >

                    ${imageHTML}


                    <div
                      class="news-content"
                    >

                      <div
                        class="news-source"
                      >

                        ${escapeHTML(
                          news.source
                        )}

                      </div>


                      <h3
                        class="news-title"
                      >

                        ${escapeHTML(
                          news.title
                        )}

                      </h3>


                      <div
                        class="news-description"
                      >

                        ${escapeHTML(
                          news.description
                            .substring(
                              0,
                              180
                            )
                        )}

                      </div>


                      <div
                        class="news-date"
                      >

                        ${formatDate(
                          news.pubDate
                        )}

                      </div>

                    </div>

                  </article>

                </a>

              `;

            }
          )
          .join("");

    }


    /* =================================================
       EVENTO BUSCADOR
    ================================================== */

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const clearSearch =
      document.getElementById(
        "clearSearch"
      );


    searchInput.addEventListener(
      "input",
      function() {

        currentSearch =
          this.value.trim();


        clearSearch.style.display =
          currentSearch
            ? "block"
            : "none";


        renderNews();

      }
    );


    clearSearch.addEventListener(
      "click",
      function() {

        searchInput.value =
          "";

        currentSearch =
          "";

        clearSearch.style.display =
          "none";

        searchInput.focus();

        renderNews();

      }
    );


    /* =================================================
       FILTROS
    ================================================== */

    document
      .querySelectorAll(
        ".nav button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {


              document
                .querySelectorAll(
                  ".nav button"
                )
                .forEach(
                  btn =>
                    btn.classList
                      .remove(
                        "active"
                      )
                );


              button.classList.add(
                "active"
              );


              currentCategory =
                button.dataset
                  .category;


              renderNews();

            }
          );

        }
      );


    /* =================================================
       INICIO
    ================================================== */

    loadRSS();


    /* Actualización automática */

    setInterval(
      loadRSS,
      5 * 60 * 1000
    );

  </script>
