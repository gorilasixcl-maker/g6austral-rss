<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Informados y No Manipulados | Noticias</title>

<meta name="description" content="G6 Austral — Noticias, defensa, seguridad, política, economía e información internacional.">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #080808;
    color: #f4f4f4;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

.hero {
    position: relative;
    width: 100%;
    min-height: 360px;
    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.05) 0%,
            rgba(0,0,0,0.15) 45%,
            rgba(8,8,8,1) 100%
        ),
        url("banner-g6austral.png");

    background-size: cover;
    background-position: center;
    display: flex;
    align-items: flex-end;
}

.hero-overlay {
    width: 100%;
    padding: 40px 25px 30px;
    background: linear-gradient(
        to top,
        rgba(8,8,8,1),
        rgba(8,8,8,0)
    );
}

.hero-content {
    max-width: 1250px;
    margin: auto;
}

.brand-title {
    font-size: clamp(30px, 5vw, 58px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 3px 12px #000;
}

.brand-subtitle {
    margin-top: 8px;
    color: #d6a82c;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* =========================
   NAVIGATION
========================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(8,8,8,0.97);
    border-top: 1px solid #282828;
    border-bottom: 2px solid #b00000;
    backdrop-filter: blur(8px);
}

.nav-container {
    max-width: 1250px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding: 0 15px;
}

.nav-button {
    background: transparent;
    color: #ddd;
    border: 0;
    padding: 16px 13px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    letter-spacing: .5px;
}

.nav-button:hover,
.nav-button.active {
    color: #d6a82c;
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1250px;
    margin: auto;
    padding: 30px 20px 60px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
}

.section-title {
    margin: 0;
    padding-left: 14px;
    border-left: 5px solid #b00000;
    font-size: 25px;
    font-weight: 900;
}

.update-status {
    color: #888;
    font-size: 12px;
}

/* =========================
   FEATURED
========================= */

.featured {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 18px;
    margin-bottom: 30px;
}

.feature-card {
    min-height: 330px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    background: #151515;
    border: 1px solid #292929;
}

.feature-main {
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,0.95),
            rgba(0,0,0,0.15)
        );
}

.feature-label {
    display: inline-block;
    width: fit-content;
    background: #b00000;
    color: #fff;
    padding: 6px 9px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.feature-title {
    margin: 0;
    font-size: clamp(25px, 3vw, 38px);
    line-height: 1.15;
}

.feature-description {
    color: #bbb;
    line-height: 1.5;
    margin: 14px 0;
}

.feature-link {
    color: #d6a82c;
    font-weight: bold;
    text-decoration: none;
}

.feature-link:hover {
    text-decoration: underline;
}

.side-news {
    display: grid;
    gap: 18px;
}

.side-card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 20px;
}

.side-card:hover,
.news-card:hover {
    border-color: #b00000;
}

.side-source,
.news-source {
    color: #d6a82c;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.side-title {
    font-size: 18px;
    line-height: 1.3;
    margin: 0;
}

/* =========================
   NEWS GRID
========================= */

.news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.news-card {
    background: #141414;
    border: 1px solid #272727;
    border-radius: 8px;
    padding: 20px;
    transition: .2s ease;
}

.news-title {
    font-size: 19px;
    line-height: 1.3;
    margin: 0 0 12px;
}

.news-description {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.news-meta {
    color: #777;
    font-size: 11px;
    margin-bottom: 15px;
}

.read-button {
    display: inline-block;
    padding: 9px 13px;
    border: 1px solid #555;
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    border-radius: 4px;
}

.read-button:hover {
    background: #b00000;
    border-color: #b00000;
}

/* =========================
   LOADING / ERROR
========================= */

.loading,
.error {
    padding: 40px;
    text-align: center;
    background: #121212;
    border: 1px solid #292929;
    border-radius: 8px;
    color: #999;
}

.error {
    color: #d77;
}

/* =========================
   FOOTER
========================= */

footer {
    border-top: 1px solid #222;
    background: #050505;
    padding: 35px 20px;
    text-align: center;
}

.footer-brand {
    color: #d6a82c;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
}

.footer-text {
    color: #666;
    font-size: 12px;
    margin-top: 10px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .featured {
        grid-template-columns: 1fr;
    }

    .news-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero {
        min-height: 300px;
    }
}

@media (max-width: 600px) {

    .hero {
        min-height: 240px;
        background-position: center;
    }

    .hero-overlay {
        padding: 30px 15px 22px;
    }

    main {
        padding: 25px 12px 45px;
    }

    .section-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .news-grid {
        grid-template-columns: 1fr;
    }

    .feature-card {
        min-height: 300px;
    }

    .feature-main {
        padding: 22px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HERO
========================= -->

<header class="hero">

    <div class="hero-overlay">

        <div class="hero-content">

            <div class="brand-title">
                Informados y No Manipulados
            </div>

            <div class="brand-subtitle">
                INFORMACIÓN · DEFENSA · SEGURIDAD · INTERNACIONAL
            </div>

        </div>

    </div>

</header>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="navbar">

    <div class="nav-container">

        <button class="nav-button active" data-category="todos">
            ÚLTIMAS
        </button>

        <button class="nav-button" data-category="chile">
            CHILE
        </button>

        <button class="nav-button" data-category="politica">
            POLÍTICA
        </button>

        <button class="nav-button" data-category="defensa">
            DEFENSA
        </button>

        <button class="nav-button" data-category="seguridad">
            SEGURIDAD
        </button>

        <button class="nav-button" data-category="internacional">
            INTERNACIONAL
        </button>

        <button class="nav-button" data-category="economia">
            ECONOMÍA
        </button>

    </div>

</nav>


<!-- =========================
     CONTENT
========================= -->

<main>

    <div class="section-header">

        <h1 class="section-title">
            Últimas Noticias
        </h1>

        <div class="update-status" id="updateStatus">
            Conectando con INM...
        </div>

    </div>


    <section id="featured">

        <div class="loading">
            Cargando noticias...
        </div>

    </section>


    <section>

        <div class="section-header">

            <h2 class="section-title">
                Más Noticias
            </h2>

        </div>

        <div
            id="newsGrid"
            class="news-grid"
        >

        </div>

    </section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="footer-brand">
        Informados y No Manipulados
    </div>

    <div class="footer-text">
        Noticias y actualidad · Chile · Defensa · Seguridad · Internacional
    </div>

    <div class="footer-text">
        Las noticias enlazan a sus fuentes originales.
    </div>

</footer>


<script>

/* =========================
   RSS
========================= */

const RSS_URL = "feed.xml";

let noticias = [];


/* =========================
   LIMPIAR HTML
========================= */

function limpiarHTML(texto) {

    const div = document.createElement("div");

    div.innerHTML = texto || "";

    return div.textContent || div.innerText || "";

}


/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "";
    }

    const date = new Date(fecha);

    if (isNaN(date)) {
        return "";
    }

    return date.toLocaleString(
        "es-CL",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================
   CATEGORIZAR
========================= */

function obtenerCategoria(noticia) {

    const texto = (
        noticia.titulo +
        " " +
        noticia.descripcion +
        " " +
        noticia.fuente
    ).toLowerCase();


    if (
        texto.includes("defensa") ||
        texto.includes("militar") ||
        texto.includes("ejército") ||
        texto.includes("ejercito") ||
        texto.includes("armada") ||
        texto.includes("fuerza aérea") ||
        texto.includes("fuerza aerea") ||
        texto.includes("ffaa") ||
        texto.includes("otan") ||
        texto.includes("misil") ||
        texto.includes("tanque") ||
        texto.includes("soldado") ||
        texto.includes("infodefensa") ||
        texto.includes("ministerio de defensa")
    ) {
        return "defensa";
    }


    if (
        texto.includes("seguridad") ||
        texto.includes("carabineros") ||
        texto.includes("policía") ||
        texto.includes("policia") ||
        texto.includes("pdi") ||
        texto.includes("delito") ||
        texto.includes("crimen") ||
        texto.includes("narcotráfico") ||
        texto.includes("narcotrafico")
    ) {
        return "seguridad";
    }


    if (
        texto.includes("economía") ||
        texto.includes("economia") ||
        texto.includes("dólar") ||
        texto.includes("dolar") ||
        texto.includes("inflación") ||
        texto.includes("inflacion") ||
        texto.includes("mercado") ||
        texto.includes("banco central") ||
        texto.includes("empresas")
    ) {
        return "economia";
    }


    if (
        texto.includes("elección") ||
        texto.includes("elecciones") ||
        texto.includes("presidente") ||
        texto.includes("congreso") ||
        texto.includes("senado") ||
        texto.includes("diputados") ||
        texto.includes("gobierno") ||
        texto.includes("ministro") ||
        texto.includes("partido") ||
        texto.includes("ley")
    ) {
        return "politica";
    }


    if (
        texto.includes("chile") ||
        texto.includes("santiago") ||
        texto.includes("valparaíso") ||
        texto.includes("valparaiso") ||
        texto.includes("región") ||
        texto.includes("region")
    ) {
        return "chile";
    }


    return "internacional";

}


/* =========================
   CREAR TARJETA
========================= */

function crearTarjeta(noticia) {

    const article = document.createElement("article");

    article.className = "news-card";

    article.dataset.category = noticia.categoria;


    article.innerHTML = `

        <div class="news-source">
            ${noticia.fuente}
        </div>

        <h3 class="news-title">
            ${noticia.titulo}
        </h3>

        <div class="news-description">
            ${noticia.descripcion}
        </div>

        <div class="news-meta">
            ${formatearFecha(noticia.fecha)}
        </div>

        <a
            class="read-button"
            href="${noticia.enlace}"
            target="_blank"
            rel="noopener noreferrer"
        >
            LEER NOTICIA →
        </a>

    `;

    return article;

}


/* =========================
   MOSTRAR NOTICIAS
========================= */

function mostrarNoticias(lista) {

    const featured = document.getElementById("featured");

    const grid = document.getElementById("newsGrid");


    featured.innerHTML = "";

    grid.innerHTML = "";


    if (!lista.length) {

        featured.innerHTML = `
            <div class="loading">
                No hay noticias disponibles en esta categoría.
            </div>
        `;

        return;

    }


    /* NOTICIA PRINCIPAL */

    const principal = lista[0];


    const featureCard =
        document.createElement("article");

    featureCard.className =
        "feature-card feature-main";


    featureCard.innerHTML = `

        <div class="feature-label">
            NOTICIA DESTACADA
        </div>

        <h2 class="feature-title">
            ${principal.titulo}
        </h2>

        <div class="feature-description">
            ${principal.descripcion}
        </div>

        <div class="news-meta">
            ${principal.fuente}
            ·
            ${formatearFecha(principal.fecha)}
        </div>

        <a
            class="feature-link"
            href="${principal.enlace}"
            target="_blank"
            rel="noopener noreferrer"
        >
            LEER NOTICIA COMPLETA →
        </a>

    `;


    featured.appendChild(featureCard);


    /* RESTO DE NOTICIAS */

    lista.slice(1, 19).forEach(noticia => {

        grid.appendChild(
            crearTarjeta(noticia)
        );

    });

}


/* =========================
   CARGAR RSS
========================= */

async function cargarRSS() {

    try {

        const respuesta =
            await fetch(
                RSS_URL + "?t=" + Date.now()
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo cargar el RSS"
            );

        }


        const texto =
            await respuesta.text();


        const parser =
            new DOMParser();


        const xml =
            parser.parseFromString(
                texto,
                "application/xml"
            );


        const items =
            xml.querySelectorAll("item");


        noticias = [];


        items.forEach(item => {

            const titulo =
                item.querySelector("title")
                ?.textContent
                ?.trim() || "";


            const enlace =
                item.querySelector("link")
                ?.textContent
                ?.trim() || "#";


            const descripcion =
                limpiarHTML(
                    item.querySelector("description")
                    ?.textContent || ""
                );


            const fuente =
                item.querySelector("source")
                ?.textContent
                ?.trim() ||
                "G6 Austral";


            const fecha =
                item.querySelector("pubDate")
                ?.textContent
                ?.trim() || "";


            if (!titulo) {
                return;
            }


            const noticia = {

                titulo:
                    titulo,

                enlace:
                    enlace,

                descripcion:
                    descripcion,

                fuente:
                    fuente,

                fecha:
                    fecha

            };


            noticia.categoria =
                obtenerCategoria(noticia);


            noticias.push(noticia);

        });


        /* Ordenar por fecha */

        noticias.sort(
            (a, b) =>
                new Date(b.fecha) -
                new Date(a.fecha)
        );


        mostrarNoticias(noticias);


        const ahora =
            new Date().toLocaleTimeString(
                "es-CL",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        document.getElementById(
            "updateStatus"
        ).textContent =
            `Actualizado · ${ahora}`;


    } catch (error) {

        console.error(error);


        document.getElementById(
            "featured"
        ).innerHTML = `

            <div class="error">

                No fue posible cargar las noticias.

                <br><br>

                Intenta actualizar la página.

            </div>

        `;

        document.getElementById(
            "updateStatus"
        ).textContent =
            "Error al actualizar";

    }

}


/* =========================
   FILTROS
========================= */

document
    .querySelectorAll(".nav-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".nav-button")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );


                button.classList.add("active");


                const categoria =
                    button.dataset.category;


                if (categoria === "todos") {

                    mostrarNoticias(
                        noticias
                    );

                    return;

                }


                const filtradas =
                    noticias.filter(
                        noticia =>
                            noticia.categoria ===
                            categoria
                    );


                mostrarNoticias(
                    filtradas
                );

            }
        );

    });


/* =========================
   INICIO
========================= */

cargarRSS();


/* Actualización visual cada 5 minutos */

setInterval(
    cargarRSS,
    5 * 60 * 1000
);

</script>

</body>
</html>
